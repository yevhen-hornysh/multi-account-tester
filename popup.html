<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Account Tester</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

      <header class="popup__header">
        <p class="popup__eyebrow">Session Manager</p>
        <h1>Multi-Account Tester</h1>
        <p class="popup__subtitle">Save the current browser session under a reusable test profile.</p>
      </header>

      <section class="panel panel--form" aria-labelledby="save-session-title">
        <div class="panel__title-row">
          <h2 id="save-session-title">Save Session</h2>
        </div>

        <div class="field">
          <label for="profileName">Profile name</label>
          <input
            id="profileName"
            name="profileName"
            type="text"
            placeholder="QA Admin"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="domain">Domain</label>
          <input
            id="domain"
            name="domain"
            type="text"
            placeholder="example.com"
            autocomplete="off"
          />
        </div>

        <button id="saveSessionButton" class="button button--primary" type="button">
          Save current session
        </button>
      </section>

      <section class="panel" aria-labelledby="saved-profiles-title">
        <div class="panel__title-row">
          <h2 id="saved-profiles-title">Saved profiles</h2>
        </div>
        <div id="profilesList" class="profiles-list"></div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
